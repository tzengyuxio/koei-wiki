<!--
  koei-wiki Body HTML for Wiki.js.
  Paste into Administration > Theme > Code Injection > Body HTML Injection.
  This file is the source of truth; the admin field is a copy. Styles live in theme.css (.kw-follow).

  Adds a "follow 司馬Game on Facebook" link to the footer of every page. The footer is rendered by
  Vue after this script runs, so wait for it to appear. Facebook icon from Simple Icons (CC0).
-->
<script>
(function () {
  var link = '<span><a class="kw-follow" href="https://www.facebook.com/simagame" target="_blank" rel="noopener">' +
    '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/></svg>' +
    '追蹤 司馬Game 粉專</a></span>'; // span is the flex item, so the link stays inline
  function add() {
    var footer = document.querySelector('.v-footer');
    if (footer && !footer.querySelector('.kw-follow')) footer.insertAdjacentHTML('afterbegin', link);
  }
  add();
  new MutationObserver(add).observe(document.body, { childList: true, subtree: true });
})();
</script>
